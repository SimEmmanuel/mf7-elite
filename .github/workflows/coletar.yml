# Roda o coletor a cada 30 min e publica o site no GitHub Pages.
# Configuração (Settings → Secrets and variables → Actions):
#   Secrets:   COC_EMAIL, COC_PASSWORD   (login do developer.clashofclans.com)
#              COC_PAINEL_SENHA          (senha do Painel da Liderança)
#   Variables: COC_CLAN_TAG              (ex.: #2U2QJJ9J8)
name: Coletar dados do clã

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência de criptografia
        run: pip install --quiet cryptography

      - name: Coletar
        env:
          COC_EMAIL: ${{ secrets.COC_EMAIL }}
          COC_PASSWORD: ${{ secrets.COC_PASSWORD }}
          COC_PAINEL_SENHA: ${{ secrets.COC_PAINEL_SENHA }}
          COC_CLAN_TAG: ${{ vars.COC_CLAN_TAG }}
          COC_EXIGIR_SENHA: "1"
        run: python3 coletor.py

      - name: Salvar histórico (cifrado) no repositório
        run: |
          git config user.name "coletor-bot"
          git config user.email "coletor-bot@users.noreply.github.com"
          # o banco aberto não vai mais para o repositório público, só a versão cifrada
          git rm --cached --quiet --ignore-unmatch cla.db
          git add cla.db.enc site/data.json
          git diff --cached --quiet || git commit -m "Coleta $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
